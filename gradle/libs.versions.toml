icu4j = ["icu4j", "icu4j-charset", "icu4j-localespi"]
truezip = ["truezip-driver-file", "truezip-driver-tar", "truezip-driver-zip", "truezip-file", "truezip-kernel", "truezip-swing"]
derby = ["derby", "derbyclient", "derbynet"]
activemq = ["activemq-client", "activemq-broker"]
graalvm = ["graalvm-polyglot", "graalvm-js-scriptengine"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.4" }
spotbugs = { id = "com.github.spotbugs", version = "6.0.7" }
